driver:
  pkg_name: PTX_SERVOS
  display_name: Servos PanTilt
  description: Driver package for pan tilt servo devices
  type: PTX
  group_id: None
  NODE_DICT:
    file_name: ptx_servos_node.py
    class_name: ServosPanTiltNode
  DRIVER_DICT:
    file_name: None
    class_name: None
  DISCOVERY_DICT:
    file_name: ptx_servos_discovery.py
    class_name: ServosPanTiltDiscovery
    process: CALL
    OPTIONS:
      pan_servo:
        type: Discrete
        options:
          - 'SVX_DEVICES'
        default: 'None'
        value: 'None'
      tilt_servo:
        type: Discrete
        options:
          - 'SVX_DEVICES'
        default: 'None'
        value: 'None'


